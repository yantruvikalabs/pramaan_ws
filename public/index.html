<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pramaan API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7f4;
        color: #18211f;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 640px);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 24px;
        max-width: 56ch;
        color: #4c5854;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      a {
        color: #0f6b58;
        font-weight: 700;
      }

      code {
        font: 0.95em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #101513;
          color: #eff4ee;
        }

        p {
          color: #b9c5c0;
        }

        a {
          color: #65d6b7;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pramaan API</h1>
      <p>This deployment serves the Pramaan backend. Use <code>/health</code> for status checks and <code>/api/*</code> for API routes.</p>
      <a href="/health">Open health check</a>
    </main>
  </body>
</html>
