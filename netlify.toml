# Netlify configuration for the Pramaan API.
#
# Netlify serves static files or functions; it never runs `npm start`. The
# whole API is therefore one function, and every request is rewritten to it.

[build]
  # `build` is a syntax check, not a compile — the API is plain ESM run as-is.
  # It exists so a typo in the function fails the deploy rather than every
  # request afterwards.
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # The secrets themselves are supplied only by Netlify environment variables.
  # Secret scanning compares those configured values against the generated
  # serverless bundle; these server-only keys are intentionally present only at
  # runtime, so omit their values from this deploy-time comparison without
  # disabling smart detection or broader scanning.
  SECRETS_SCAN_OMIT_KEYS = "MONGODB_URI,JWT_SECRET,CHAIN_PRIVATE_KEY_PEM,CORS_ORIGINS,MONGODB_DB"

[functions]
  node_bundler = "esbuild"
  # The driver loads optional native add-ons (kerberos, client-side field
  # encryption) by name at runtime. esbuild cannot see those, and bundling it
  # produces a function that builds cleanly and fails on first connect.
  external_node_modules = ["mongodb"]

# Both base URLs work: `https://host` and `https://host/api`. The function
# strips either prefix, so a client configured with one is not broken by the
# other. `/api/*` is listed first because the catch-all would otherwise
# swallow it and hand Express a path with the prefix still attached.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Every remaining path, including `/`, is the API. `force` because the publish
# directory would otherwise win for any path matching a file in it.
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
